AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Firebase Proxy Lambda - Invocacao direta via AWS SDK

Parameters:
  FirebaseServiceAccountKey:
    Type: String
    NoEcho: true

Resources:
  FirebaseProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ipredencao-firebase-proxy
      CodeUri: target/firebase-proxy-lambda-1.0.0.jar
      Handler: org.ipredencao.lambda.FirebaseProxyHandler::handleRequest
      Runtime: java17
      MemorySize: 1024
      Timeout: 15
      # SnapStart so se aplica a versao publicada, por isso o alias.
      # Consequencia: deploy tem que ser via deploy.sh (SAM), nunca quick-deploy.sh.
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          FIREBASE_SERVICE_ACCOUNT_KEY_CONTENT: !Ref FirebaseServiceAccountKey
      # Sem Events de API Gateway - invocacao direta

Outputs:
  FunctionArn:
    Value: !GetAtt FirebaseProxyFunction.Arn
  FunctionName:
    Value: !Ref FirebaseProxyFunction
  QualifiedFunctionName:
    Description: Valor que FIREBASE_LAMBDA_NAME deve ter no App Runner
    Value: !Sub "${FirebaseProxyFunction}:live"
