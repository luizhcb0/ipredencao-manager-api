# Configurações de produção
# Nota: spring.profiles.active é definido via variável de ambiente

# DB - Produção (usar variáveis de ambiente)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - Pool de Conexões (ESSENCIAL para performance)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Liquibase - Produção
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JOOQ
spring.jooq.sql-dialect=POSTGRES

# AWS S3 - Produção
# Define endpoint vazio para usar S3 real da AWS (não LocalStack)
cloud.aws.s3.endpoint=
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${S3_BUCKET_NAME}

# Upload de arquivos - Limite de 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS - Produção (mais restritivo - CONFIGURAR DOMÍNIOS REAIS)
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://seu-dominio.com,https://www.seu-dominio.com}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Content-Type,Authorization,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
app.cors.allow-credentials=true
app.cors.max-age=86400

# Logs de produção (menos verbosos)
logging.level.org.ipredencao.ipredencao_manager=INFO
logging.level.org.springframework.web.cors=WARN
logging.level.org.springframework.security=WARN

# Desabilitar SQL logs em produção
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configurações de segurança para produção
server.error.include-stacktrace=never
server.error.include-message=never

# Firebase Production (usar variáveis de ambiente)
firebase.service-account-key-path=
firebase.service-account-key-content=${FIREBASE_SERVICE_ACCOUNT_KEY_CONTENT}

# JWT Production (OBRIGATÓRIO configurar)
jwt.secret=${JWT_SECRET}
jwt.expiration=36000
jwt.refresh-expiration=2592000

# Security Production
security.rate-limit.login-attempts=5
security.rate-limit.lockout-duration=30

# Logs de autenticacao
logging.level.org.ipredencao.ipredencao_manager.filter=INFO

# Compressão HTTP (reduz consumo de banda na AWS)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024