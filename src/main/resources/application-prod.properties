# Configurações de produção
# Nota: spring.profiles.active é definido via variável de ambiente

# DB - Produção (usar variáveis de ambiente)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool JDBC - manter conexoes vivas e falhar rapido.
# keepalive-time e o item central: sem ele, uma conexao derrubada pelo caminho de
# rede (o VPC connector e um ENI intermediario) so e descoberta quando alguem a
# pega, e o custo de reabrir cai na requisicao de login. Com keepalive, o Hikari
# sonda e substitui em background.
# minimum-idle explicito porque o default do Hikari e igual ao maximum-pool-size.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=900000

# Liquibase - Produção
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JOOQ
spring.jooq.sql-dialect=POSTGRES

# AWS S3 - Produção
# Define endpoint vazio para usar S3 real da AWS (não LocalStack)
cloud.aws.s3.endpoint=
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${S3_BUCKET_NAME}

# Upload de arquivos - Limite de 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS - Produção (mais restritivo - CONFIGURAR DOMÍNIOS REAIS)
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://seu-dominio.com,https://www.seu-dominio.com}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Content-Type,Authorization,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
app.cors.allow-credentials=true
app.cors.max-age=86400

# Logs de produção (menos verbosos)
logging.level.org.ipredencao.ipredencao_manager=INFO
logging.level.org.springframework.web.cors=WARN
logging.level.org.springframework.security=WARN

# JOOQ (sem JPA/Hibernate — propriedades spring.jpa.* não se aplicam).

# Configurações de segurança para produção
server.error.include-stacktrace=never
server.error.include-message=never

# Firebase Production (usar variáveis de ambiente)
# App Runner: FIREBASE_SERVICE_ACCOUNT_KEY_CONTENT (JSON minificado)
# Local Docker: FIREBASE_SERVICE_ACCOUNT_KEY_PATH (arquivo montado)
firebase.service-account-key-path=${FIREBASE_SERVICE_ACCOUNT_KEY_PATH:}
firebase.service-account-key-content=${FIREBASE_SERVICE_ACCOUNT_KEY_CONTENT:}
# Firebase Lambda (quando configurado, usa invocacao direta via AWS SDK)
firebase.lambda.name=${FIREBASE_LAMBDA_NAME:}

# JWT Production (OBRIGATÓRIO configurar)
jwt.secret=${JWT_SECRET}
jwt.expiration=36000
jwt.refresh-expiration=2592000

# Security Production
security.rate-limit.login-attempts=5
security.rate-limit.lockout-duration=30

# Monitoring Production
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Liveness em /actuator/health/liveness: so responde se o processo esta de pe.
# O health check do App Runner aponta para ca para que instabilidade do RDS nao
# marque a instancia como unhealthy (5 falhas x 20s) e provoque substituicao,
# cujo boot custa ~90s. O /actuator/health completo segue para diagnostico.
management.endpoint.health.group.liveness.include=ping

# Logs de autenticação em produção (menos verbosos)
logging.level.org.ipredencao.ipredencao_manager.filter=INFO