# Configurações de produção
spring.profiles.active=prod

# CORS - Produção (mais restritivo - CONFIGURAR DOMÍNIOS REAIS)
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://seu-dominio.com,https://www.seu-dominio.com}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Content-Type,Authorization,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
app.cors.allow-credentials=true
app.cors.max-age=86400

# Logs de produção (menos verbosos)
logging.level.org.ipredencao.ipredencao_manager=INFO
logging.level.org.springframework.web.cors=WARN
logging.level.org.springframework.security=WARN

# Desabilitar SQL logs em produção
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configurações de segurança para produção
server.error.include-stacktrace=never
server.error.include-message=never