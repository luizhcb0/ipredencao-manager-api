spring.application.name=ipredencao-manager

# DB
spring.datasource.url=jdbc:postgresql://localhost:54329/ipredencao_manager
spring.datasource.username=ipredencao_manager
spring.datasource.password=ipredencao_manager
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JOOQ
spring.jooq.sql-dialect=POSTGRES

# Localstack
cloud.aws.s3.endpoint=http://localhost:4566
cloud.aws.s3.bucket=${S3_BUCKET_NAME:ipredencao-storage}
cloud.aws.region.static=us-east-1

# CORS - Configurações para ambiente local
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# Upload de arquivos - Limite de 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs para desenvolvimento local
logging.level.org.ipredencao.ipredencao_manager=DEBUG
logging.level.org.springframework.web.cors=DEBUG

# Mostrar SQL no console para debug local
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Profile ativo (padrão: local, produção via variável de ambiente)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Firebase Configuration
firebase.service-account-key-path=${FIREBASE_SERVICE_ACCOUNT_KEY_PATH:src/main/resources/ipredencao-manager-api-firebase-adminsdk.json}
firebase.service-account-key-content=${FIREBASE_SERVICE_ACCOUNT_KEY_CONTENT:}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-must-be-256-bits-long-for-HS256}
jwt.expiration=${JWT_EXPIRATION:36000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000}
jwt.issuer=${JWT_ISSUER:ipredencao-manager}

# Security Configuration
security.rate-limit.login-attempts=5
security.rate-limit.lockout-duration=30

# Monitoring (Actuator)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Logging para autenticação
logging.level.org.ipredencao.ipredencao_manager.filter=DEBUG
logging.level.org.springframework.security=DEBUG
