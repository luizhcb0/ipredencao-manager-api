spring.application.name=ipredencao-manager-test

# Liquibase aplica V001..V007 no startup contra o Postgres de teste
# (datasource via @ServiceConnection / Testcontainers no IntegrationTestBase).
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Evita que spring-boot-docker-compose tente subir compose.yaml durante IT.
spring.docker.compose.enabled=false

spring.jooq.sql-dialect=POSTGRES

# JWT: secret valido, mas nunca exercitado (testes usam @WithMockUser, que popula
# o SecurityContext antes do filter rodar).
jwt.secret=test-secret-key-must-be-at-least-32-chars-long
jwt.expiration=36000
jwt.refresh-expiration=2592000
jwt.issuer=ipredencao-manager-test

# Firebase: o @MockitoBean em IntegrationTestBase neutraliza FirebaseConfig;
# manter strings vazias e' defesa em profundidade caso o mock falhe.
firebase.service-account-key-path=
firebase.service-account-key-content=
firebase.lambda.name=

# S3/AWS: endpoint vazio para o S3Config nao tentar LocalStack.
cloud.aws.s3.endpoint=
cloud.aws.s3.bucket=test-bucket
cloud.aws.region.static=us-east-1

# CORS (irrelevante em IT mas evita warnings).
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# Reduz verbosidade.
logging.level.org.ipredencao.ipredencao_manager=INFO
logging.level.org.testcontainers=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.cors=WARN

# Actuator: minimo para nao explodir.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Rate limit (irrelevante em IT, mas alguns beans leem).
security.rate-limit.login-attempts=5
security.rate-limit.lockout-duration=30
